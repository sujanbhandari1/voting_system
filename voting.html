<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vote | Blockchain Transparent Voting System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="vote">
    <div class="app-shell">
      <header class="navbar">
        <div class="container nav-inner">
          <a class="brand" href="dashboard.html">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M20 6L9 17l-5-5"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="brand-name">BlockVote</span>
          </a>
          <div class="nav-meta">
            <nav class="nav-links">
              <a href="dashboard.html" data-nav="dashboard">Dashboard</a>
              <a href="voting.html" data-nav="vote">Vote</a>
              <a href="results.html" data-nav="results">Results</a>
              <a href="admin.html" data-nav="admin" data-admin-link>Admin</a>
            </nav>
            <div class="button-row">
              <span class="tag" data-session-user>Guest</span>
              <button class="ghost-btn" type="button" data-logout-btn hidden>Logout</button>
            </div>
          </div>
        </div>
      </header>

      <main class="container page">
        <section class="hero hero-visual">
          <div class="hero-copy">
            <span class="tag">Voting Page</span>
            <h1>Cast a secure digital ballot</h1>
            <p data-election-state>Voting is currently open.</p>
          </div>
          <div class="hero-figure" aria-hidden="true">
            <svg class="figure-illustration" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="vg1" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#1f6feb" stop-opacity="0.92" />
                  <stop offset="1" stop-color="#1f9d7a" stop-opacity="0.92" />
                </linearGradient>
                <linearGradient id="vg2" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0" stop-color="#1f6feb" stop-opacity="0.12" />
                  <stop offset="1" stop-color="#1f9d7a" stop-opacity="0.12" />
                </linearGradient>
              </defs>
              <rect x="44" y="48" width="552" height="264" rx="28" fill="url(#vg2)" />
              <path
                d="M226 248h188c18 0 32-14 32-32v-72c0-18-14-32-32-32H226c-18 0-32 14-32 32v72c0 18 14 32 32 32z"
                stroke="url(#vg1)"
                stroke-width="10"
              />
              <path
                d="M260 178l34 34 86-96"
                stroke="url(#vg1)"
                stroke-width="12"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect x="164" y="120" width="312" height="30" rx="15" fill="url(#vg1)" opacity="0.14" />
              <rect x="164" y="212" width="312" height="30" rx="15" fill="url(#vg1)" opacity="0.14" />
            </svg>
          </div>
        </section>

        <section class="actions">
          <div class="message warning" data-vote-banner>Select one candidate to cast your vote.</div>
          <div class="transaction-box">
            <strong>Transaction Hash</strong>
            <p class="muted" data-hash>Transaction hash will appear here after the vote is recorded.</p>
          </div>
        </section>

        <section class="candidate-grid" data-candidate-list></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
